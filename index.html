<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Heading -->
    <h1>Budget Tracker</h1>

    <!-- Add Expense Form -->
    <form>
        <h2>Add Expense</h2>

        <label for="name">Expense Name</label>
        <input type="text" id="name" placeholder="Enter expense name">

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label for="category">Category</label>
        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Rent</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date">

        <button type="submit">Add Expense</button>
    </form>

    <!-- Expense Table -->
    <table>
        <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
        </tr>

        <tr>
            <td>Lunch</td>
            <td>$10</td>
            <td>Food</td>
            <td>2026-09-28</td>
        </tr>

        <tr>
            <td>Bus Fare</td>
            <td>$5</td>
            <td>Transport</td>
            <td>2026-09-27</td>
        </tr>

        <tr>
            <td>Rent</td>
            <td>$200</td>
            <td>Rent</td>
            <td>2026-09-26</td>
        </tr>

        <tr>
            <td>Movie</td>
            <td>$15</td>
            <td>Entertainment</td>
            <td>2026-09-25</td>
        </tr>

        <tr>
            <td>Groceries</td>
            <td>$50</td>
            <td>Food</td>
            <td>2026-09-24</td>
        </tr>
    </table>

</body>
</html>
